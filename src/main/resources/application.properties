# Tamanho maximo aceito no upload (ajuste conforme necessario)
quarkus.http.limits.max-body-size=50M

# Render (e a maioria dos PaaS) injeta a porta via variavel de ambiente PORT
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# --- Classificacao via Gemini ---
# A key nunca fica hardcoded aqui: vem da variavel de ambiente GEMINI_API_KEY.
# Se estiver vazia, ou a chamada falhar, o sistema cai automaticamente para
# a classificacao por palavra-chave abaixo.
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=gemini-3.5-flash-lite

quarkus.rest-client.gemini-api.url=https://generativelanguage.googleapis.com
quarkus.rest-client.gemini-api.scope=jakarta.inject.Singleton
quarkus.rest-client.gemini-api.connect-timeout=5000
# Uma chamada do modo CONTEXTO manda varias paginas de uma vez (nao 1 por
# vez), entao demora mais para responder - 15s era o suficiente so para o
# modo antigo (1 pagina por chamada) e faria praticamente TODA chamada do
# modo CONTEXTO cair (silenciosamente) no fallback por palavra-chave.
quarkus.rest-client.gemini-api.read-timeout=45000

# --- Modo de classificacao ---
# CONTEXTO (padrao): o Gemini recebe uma janela de varias paginas de uma vez
# (com paginas anteriores como contexto) e AGRUPA direto em documentos - ver
# AgrupadorContextualService e o CLAUDE.md. Resolve na raiz o problema de um
# anexo com timbre proprio (ex.: laudo medico de outro estado dentro de um
# pedido de TFD/RS) ser confundido com a capa de um pedido novo, porque
# classificacao pagina-a-pagina isolada nunca via a pagina anterior.
# PAGINA: comportamento antigo (classifica pagina a pagina, tenta remontar
# blocos de TFD depois com heuristica). Mantido como "botao de panico": se o
# modo CONTEXTO se mostrar pior nalgum caso real, troque essa env var no
# Render (sem precisar reimplantar codigo) para voltar ao comportamento
# conhecido.
classificador.modo=CONTEXTO

# Tamanho da janela de paginas mandada de uma vez ao Gemini no modo CONTEXTO.
classificador.contexto-paginas-por-janela=10
# Quantas paginas ANTERIORES a janela sao reenviadas so como contexto (nao
# reclassificadas) para o Gemini decidir se a 1a pagina da janela continua
# um documento que ja vinha sendo descrito.
classificador.contexto-paginas-de-contexto=4
# Trunca o texto de cada pagina nesse tanto de caracteres antes de montar o
# prompt - uma pagina com OCR ruim pode render um muro de lixo que estoura a
# janela e desfoca o modelo; o cabecalho/timbre (que importa pra segmentar)
# fica sempre no comeco da pagina.
classificador.contexto-max-caracteres-por-pagina=2500

# Palavras-chave usadas no fallback por palavra-chave (Gemini indisponivel,
# ou modo PAGINA). Comparacao e feita em minusculas e sem acentos, por
# "contains". Ordem de verificacao: TFD/RS -> TFD Outros Estados -> Protocolo
# -> Exames -> Documentos -> (senao) Outros.

# Quantidade de paginas de um bloco de TFD (RS ou outro estado) no modo
# PAGINA / fallback. Ao achar a palavra-chave na 1a pagina do bloco, as
# proximas ate completar esse total tambem entram na mesma categoria, mesmo
# sem texto identificavel (paginas de continuacao costumam nao ter). No modo
# CONTEXTO com Gemini disponivel isso nao e usado - o tamanho do bloco vem
# do proprio agrupamento que o modelo devolveu, lendo o documento de verdade.
classificador.tfd-rs-paginas-por-bloco=3

# Marcadores de Rio Grande do Sul (RS). IMPORTANTE: sozinhos NAO classificam
# como TFD_RS - "central estadual de transplantes" e "departamento de
# regulacao estadual" tambem aparecem em oficios/laudos que nada tem a ver
# com TFD (esta e justamente uma central de transplantes). So viram TFD_RS
# quando a MESMA pagina tambem bate em classificador.tfd-termo-generico
# abaixo (ver PdfSplitService.classificarPorPalavraChave).
classificador.tfd-rs-marcador=rio grande do sul,estado do rio grande do sul,secretaria estadual de saude,secretaria de estado da saude,central estadual de transplantes,departamento de regulacao estadual,solicitacao de cadastro para consulta,tfd/rs,tfd-rs,tfd rs

# Termos genericos que indicam que a pagina E sobre TFD, sem dizer de que
# estado. Pagina que bate aqui E em tfd-rs-marcador vira TFD_RS; que bate SO
# aqui vira TFD_OUTROS_ESTADOS. Removidos "central de regulacao" e
# "autorizacao de viagem" (generico demais, aparecia em documentos de
# regulacao que nao sao TFD e arrastava paginas vizinhas pro bloco errado).
classificador.tfd-termo-generico=tfd,tratamento fora de domicilio,tratamento fora do domicilio,cartao tfd

# Termos FORTES de cabecalho/timbre/titulo de formulario que indicam que a
# pagina e a CAPA de um NOVO pedido de TFD (de qualquer estado).
#
# Usados SO para decidir se a extensao do bloco de TFD deve parar naquela
# pagina - nunca para classificar. Precisa ser uma lista separada porque
# classificador.tfd-termo-generico e generica de proposito, e esses termos
# ("tfd", "tratamento fora de domicilio") aparecem no texto corrido das
# paginas de CONTINUACAO do proprio formulario do RS (o checklist medico e a
# justificativa falam SOBRE o tratamento fora de domicilio). Usar a lista
# generica aqui cortava o bloco no meio e jogava a 3a pagina de um pedido do
# RS para tfd_outros_estados.
#
# Regra pratica ao editar: so entram aqui expressoes EXCLUSIVAS do
# formulario de cadastro do RS - nunca termos genericos de "orgao publico
# de saude" (tipo "secretaria estadual de saude", "governo do estado",
# "secretaria de saude de X") ou de "pedido de TFD" (tipo "solicitacao de
# TFD", "laudo medico para TFD"), porque um pedido de TFD/RS quase sempre
# vem acompanhado de anexos emitidos pelo ESTADO DE ORIGEM do paciente (ex.:
# um laudo medico da Secretaria de Saude de Santa Catarina justificando o
# pedido) - esses anexos tem timbre/titulo institucional proprio mas
# continuam fazendo parte do MESMO bloco do RS. Um bug real: o laudo medico
# de outro estado, anexado a um pedido de RS legitimo, batia em "secretaria
# de estado da saude" (generico demais) e era tratado como capa de um NOVO
# pedido, cortando o bloco do RS pra so 1 pagina.
classificador.tfd-cabecalho-novo-documento=estado do rio grande do sul,central estadual de transplantes,departamento de regulacao estadual,solicitacao de cadastro para consulta,complexo regulador

# Quando true (padrao), a extensao do bloco de TFD so para numa pagina que
# realmente pareca a CAPA de um novo pedido: ou o Gemini respondeu que aquela
# pagina e INICIO de documento, ou o texto bateu na lista de cabecalho acima.
# Se o Gemini responder CONTINUACAO, a pagina nunca quebra o bloco.
# Colocar false volta ao comportamento antigo (qualquer pagina classificada
# como TFD quebra o bloco), que perdia paginas de continuacao.
classificador.tfd-exigir-cabecalho-para-quebrar-bloco=true

classificador.protocolo-encaminhamento=protocolo de encaminhamento,protocolo encaminhamento

classificador.exames=exame,laudo,resultado de exame,raio-x,raio x,ressonancia,tomografia,hemograma,ultrassom,ultrassonografia,ecocardiograma,eletrocardiograma,biopsia,anatomopatologico

classificador.documentos=rg,cpf,identidade,certidao,comprovante de residencia,declaracao,procuracao,carteira do sus,cartao sus,encaminhamento
