# Tamanho maximo aceito no upload (ajuste conforme necessario)
quarkus.http.limits.max-body-size=50M

# Render (e a maioria dos PaaS) injeta a porta via variavel de ambiente PORT
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# --- Classificacao via Gemini ---
# A key nunca fica hardcoded aqui: vem da variavel de ambiente GEMINI_API_KEY.
# Se estiver vazia, ou a chamada falhar, o sistema cai automaticamente para
# a classificacao por palavra-chave abaixo.
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=gemini-3.6-flash

quarkus.rest-client.gemini-api.url=https://generativelanguage.googleapis.com
quarkus.rest-client.gemini-api.scope=jakarta.inject.Singleton
quarkus.rest-client.gemini-api.connect-timeout=5000
quarkus.rest-client.gemini-api.read-timeout=15000

# Palavras-chave usadas para classificar cada pagina do PDF.
# Comparacao e feita em minusculas e sem acentos, por "contains".
# Ordem de verificacao: TFD/RS -> Exames -> Documentos -> (senao) Outros.

# Quantidade de paginas de um bloco TFD/RS. Ao achar a palavra-chave na
# 1a pagina do bloco, as proximas ate completar esse total tambem viram TFD/RS,
# mesmo sem texto identificavel (paginas de continuacao costumam nao ter).
classificador.tfd-rs-paginas-por-bloco=3

classificador.tfd-rs=tfd,tfd/rs,tfd-rs,tratamento fora de domicilio,central de regulacao,autorizacao de viagem,cartao tfd

classificador.protocolo-encaminhamento=protocolo de encaminhamento,protocolo encaminhamento

classificador.exames=exame,laudo,resultado de exame,raio-x,raio x,ressonancia,tomografia,hemograma,ultrassom,ultrassonografia,ecocardiograma,eletrocardiograma,biopsia,anatomopatologico

classificador.documentos=rg,cpf,identidade,certidao,comprovante de residencia,declaracao,procuracao,carteira do sus,cartao sus,encaminhamento
