# Tamanho maximo aceito no upload (ajuste conforme necessario)
quarkus.http.limits.max-body-size=50M

# Render (e a maioria dos PaaS) injeta a porta via variavel de ambiente PORT
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# --- Classificacao via Gemini ---
# A key nunca fica hardcoded aqui: vem da variavel de ambiente GEMINI_API_KEY.
# Se estiver vazia, ou a chamada falhar, o sistema cai automaticamente para
# a classificacao por palavra-chave abaixo.
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=gemini-3.5-flash-lite

quarkus.rest-client.gemini-api.url=https://generativelanguage.googleapis.com
quarkus.rest-client.gemini-api.scope=jakarta.inject.Singleton
quarkus.rest-client.gemini-api.connect-timeout=5000
quarkus.rest-client.gemini-api.read-timeout=15000

# Palavras-chave usadas para classificar cada pagina do PDF.
# Comparacao e feita em minusculas e sem acentos, por "contains".
# Ordem de verificacao: TFD/RS -> TFD Outros Estados -> Protocolo -> Exames -> Documentos -> (senao) Outros.

# Quantidade de paginas de um bloco de TFD (RS ou outro estado). Ao achar a
# palavra-chave na 1a pagina do bloco, as proximas ate completar esse total
# tambem entram na mesma categoria, mesmo sem texto identificavel (paginas de
# continuacao costumam nao ter).
classificador.tfd-rs-paginas-por-bloco=3

# Marcadores de Rio Grande do Sul (RS). IMPORTANTE: sozinhos NAO classificam
# como TFD_RS - "central estadual de transplantes" e "departamento de
# regulacao estadual" tambem aparecem em oficios/laudos que nada tem a ver
# com TFD (esta e justamente uma central de transplantes). So viram TFD_RS
# quando a MESMA pagina tambem bate em classificador.tfd-termo-generico
# abaixo (ver PdfSplitService.classificarPorPalavraChave).
classificador.tfd-rs-marcador=rio grande do sul,estado do rio grande do sul,secretaria estadual de saude,secretaria de estado da saude,central estadual de transplantes,departamento de regulacao estadual,solicitacao de cadastro para consulta,tfd/rs,tfd-rs,tfd rs

# Termos genericos que indicam que a pagina E sobre TFD, sem dizer de que
# estado. Pagina que bate aqui E em tfd-rs-marcador vira TFD_RS; que bate SO
# aqui vira TFD_OUTROS_ESTADOS. Removidos "central de regulacao" e
# "autorizacao de viagem" (generico demais, aparecia em documentos de
# regulacao que nao sao TFD e arrastava paginas vizinhas pro bloco errado).
classificador.tfd-termo-generico=tfd,tratamento fora de domicilio,cartao tfd

# Termos FORTES de cabecalho/timbre/titulo de formulario que indicam que a
# pagina e a CAPA de um NOVO pedido de TFD (de qualquer estado).
#
# Usados SO para decidir se a extensao do bloco de TFD deve parar naquela
# pagina - nunca para classificar. Precisa ser uma lista separada porque
# classificador.tfd-outros-estados e generica de proposito, e esses termos
# ("tfd", "tratamento fora de domicilio") aparecem no texto corrido das
# paginas de CONTINUACAO do proprio formulario do RS (o checklist medico e a
# justificativa falam SOBRE o tratamento fora de domicilio). Usar a lista
# generica aqui cortava o bloco no meio e jogava a 3a pagina de um pedido do
# RS para tfd_outros_estados.
#
# Regra pratica ao editar: so entram aqui expressoes que aparecem no
# CABECALHO de um formulario (orgao emissor, titulo do formulario), nunca
# expressoes que caibam numa frase de texto corrido.
classificador.tfd-cabecalho-novo-documento=estado do rio grande do sul,secretaria estadual de saude,secretaria de estado da saude,secretaria estadual da saude,secretaria de saude do estado,secretaria de saude de,secretaria municipal de saude,governo do estado,central estadual de transplantes,departamento de regulacao estadual,solicitacao de cadastro para consulta,solicitacao de tfd,requerimento de tfd,formulario de tfd,laudo para solicitacao de tfd,solicitacao de tratamento fora de domicilio,requerimento de tratamento fora de domicilio,autorizacao de tratamento fora de domicilio,laudo medico para tfd

# Quando true (padrao), a extensao do bloco de TFD so para numa pagina que
# realmente pareca a CAPA de um novo pedido: ou o Gemini respondeu que aquela
# pagina e INICIO de documento, ou o texto bateu na lista de cabecalho acima.
# Se o Gemini responder CONTINUACAO, a pagina nunca quebra o bloco.
# Colocar false volta ao comportamento antigo (qualquer pagina classificada
# como TFD quebra o bloco), que perdia paginas de continuacao.
classificador.tfd-exigir-cabecalho-para-quebrar-bloco=true

classificador.protocolo-encaminhamento=protocolo de encaminhamento,protocolo encaminhamento

classificador.exames=exame,laudo,resultado de exame,raio-x,raio x,ressonancia,tomografia,hemograma,ultrassom,ultrassonografia,ecocardiograma,eletrocardiograma,biopsia,anatomopatologico

classificador.documentos=rg,cpf,identidade,certidao,comprovante de residencia,declaracao,procuracao,carteira do sus,cartao sus,encaminhamento
